[project]
name = "langchain-arcnm"
version = "0.1.0"
description = "LangChain tools for ARCNM: manufacturing should-cost for machined and sheet-metal parts, from a CAD file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ARCNM", email = "hello@arcnm.io" }]
requires-python = ">=3.10,<4.0"
keywords = ["langchain", "arcnm", "cad", "manufacturing", "should-cost", "quoting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.urls]
Homepage = "https://arcnm.io"
Documentation = "https://github.com/arcnm/langchain-arcnm#readme"
Source = "https://github.com/arcnm/langchain-arcnm"
Changelog = "https://github.com/arcnm/langchain-arcnm/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "langchain-tests==1.1.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-socket>=0.7.0",
]
test_integration = []
lint = ["ruff>=0.8.0", "mypy>=1.13.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langchain_arcnm"]

[tool.hatch.build.targets.sdist]
include = ["langchain_arcnm", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T201"]

[tool.mypy]
strict = true
packages = ["langchain_arcnm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["billable: starts a calculation, which uses one from the plan"]
